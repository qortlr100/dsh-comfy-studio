# Plugin rows this bundle adds to the profile. Per-row settings go under `config`.
- insert:
    - id: cs-ui-shell
      name: "@cs/ui-shell"

    # The project layer. New project folders go to CS_PROJECTS_FOLDER (an absolute path) when it
    # is set and not empty, else to comfy-studio-projects in the home directory.
    - id: cs-project
      name: "@cs/project"
      config:
        projectsFolder: !!js process.env.CS_PROJECTS_FOLDER || undefined

    # The view API: the /api/cs/* routes and the /cs/events stream the browser views use.
    - id: cs-api
      name: "@cs/api"
